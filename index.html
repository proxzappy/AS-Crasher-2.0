    <script>
        // ---------- Matrix Rain Effect (Purple) ----------
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        const purpleChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=<>?/\\|{}[]()~^';
        const purpleColors = ['#9b30ff', '#b388ff', '#d8bfd8', '#7b1fa2', '#ab47bc'];

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px Share Tech Mono, monospace';

            for (let i = 0; i < drops.length; i++) {
                const char = purpleChars[Math.floor(Math.random() * purpleChars.length)];
                const color = purpleColors[Math.floor(Math.random() * purpleColors.length)];
                ctx.fillStyle = color;

                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(char, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // ---------- Toast Notification System ----------
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            let icon = '';
            if (type === 'success') icon = '<i class="fas fa-check-circle"></i>';
            else if (type === 'error') icon = '<i class="fas fa-exclamation-circle"></i>';
            else icon = '<i class="fas fa-info-circle"></i>';

            toast.innerHTML = `${icon} ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        const countrySelect = document.getElementById('country');
        const phoneInput = document.getElementById('phoneNumber');
        const generateBtn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const pairingCodeSpan = document.getElementById('pairingCode');
        const copyBtn = document.getElementById('copyBtn');

        // Populate country dropdown
        countries.forEach(country => {
            const option = document.createElement('option');
            option.value = country.dial;
            option.textContent = country.dial;
            option.title = `${country.name} (${country.dial})`;
            countrySelect.appendChild(option);
        });

        // Default to Pakistan
        const defaultCountry = countries.find(c => c.code === 'PK');
        if (defaultCountry) countrySelect.value = defaultCountry.dial;

        function updatePhonePlaceholder() {
            const dial = countrySelect.value;
            phoneInput.placeholder = `Number (without ${dial})`;
        }
        countrySelect.addEventListener('change', updatePhonePlaceholder);
        updatePhonePlaceholder();

        // Generate button handler
        generateBtn.addEventListener('click', async () => {
            const dialCode = countrySelect.value.replace(/[^0-9]/g, '');
            const phoneDigits = phoneInput.value.trim().replace(/[^0-9]/g, '');

            if (!phoneDigits) {
                showToast('Please enter a phone number.', 'error');
                return;
            }

            const fullNumber = dialCode + phoneDigits;
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading-spinner"></span> Generating...';
            resultBox.classList.remove('show');

            try {
                const response = await fetch(`https://as-crasher-2-0.onrender.com/api/pair?number=${fullNumber}`);
                const data = await response.json();

                if (data.success && data.code) {
                    pairingCodeSpan.textContent = data.code;
                    resultBox.classList.add('show');
                    showToast('Pairing code generated successfully!', 'success');
                } else if (data.error) {
                    showToast(data.error, 'error');
                    resultBox.classList.remove('show');
                } else {
                    showToast('Unexpected response. Please try again.', 'error');
                    resultBox.classList.remove('show');
                }
            } catch (error) {
                showToast('Network error. Please check your connection.', 'error');
                resultBox.classList.remove('show');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pairing Code';
            }
        });

        // Copy button
        copyBtn.addEventListener('click', () => {
            const code = pairingCodeSpan.textContent;
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                showToast('Copied to clipboard!', 'success');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => { copyBtn.innerHTML = originalText; }, 2000);
            }).catch(err => {
                showToast('Failed to copy. Please copy manually.', 'error');
            });
        });
    </script>
